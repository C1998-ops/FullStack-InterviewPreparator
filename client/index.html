<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO / Social Media -->
    <title>Technical Interview Prep Browser</title>
    <meta
      name="description"
      content="A browser for technical interview preparation"
    />

    <meta property="og:title" content="Technical Interview Prep Browser" />
    <meta
      property="og:description"
      content="A browser for technical interview preparation"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Minimal public shell styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, Arial,
          sans-serif;
      }

      #root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader {
        text-align: center;
        color: #333;
      }

      .loader-text {
        font-size: 1.1rem;
        font-weight: 600;
        animation: loaderTextAnimation 0.6s ease-in-out;
      }

      @keyframes loaderTextAnimation {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- Public shell (shown before React loads) -->
    <div id="main-app">
      <div class="loader" aria-live="polite">
        <h3>Loading…</h3>
        <p class="loader-text">Please wait while the app loads.</p>
      </div>
    </div>

    <!-- No-JS fallback -->
    <noscript>
      <div style="padding: 2rem; text-align: center">
        This application requires JavaScript to run.
      </div>
    </noscript>

    <!-- React entry -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
