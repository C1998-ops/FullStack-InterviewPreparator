version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd client # Navigate to your frontend folder
        - npm ci # Install dependencies
    build:
      commands:
        - npm run build # THIS is where you run your build command
  artifacts:
    baseDirectory: client/dist # or 'client/build' depending on your framework
    files:
      - "**/*"
  cache:
    paths:
      - client/node_modules/**/*
